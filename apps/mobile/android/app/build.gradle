apply plugin: 'com.android.application'

def requestedPort = providers.gradleProperty('tireApiPort').getOrElse('8000')
def requestedNamespace = providers.gradleProperty('tireSessionNamespace').getOrElse('default')
def requestedTestBuildType = providers.gradleProperty('tireTestBuildType').getOrElse('debug')
if (!(requestedTestBuildType in ['debug', 'offlineQa'])) {
    throw new GradleException('tireTestBuildType must be debug or offlineQa')
}
if (!(requestedPort ==~ /[0-9]{4,5}/) || requestedPort.toInteger() < 1024 || requestedPort.toInteger() > 65535) {
    throw new GradleException('tireApiPort must be an integer from 1024 to 65535')
}
if (!(requestedNamespace ==~ /[a-z0-9](?:[a-z0-9-]{0,46}[a-z0-9])?/)) {
    throw new GradleException('tireSessionNamespace must be 1-48 lowercase letters, digits or internal hyphens')
}

android {
    testBuildType = requestedTestBuildType
    namespace = "org.taiji.tireintelligence.mobile"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "org.taiji.tireintelligence.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.1.0"
        def hostDigest = java.security.MessageDigest.getInstance('SHA-256')
        hostDigest.update('android-offline-host@1\u0000'.getBytes('UTF-8'))
        def hostFiles = fileTree('src/main/java').matching { include '**/*.java' }.files.toList()
        hostFiles += [file('build.gradle'), file('src/main/AndroidManifest.xml'), rootProject.file('build.gradle'), rootProject.file('variables.gradle')]
        hostFiles.sort { a, b -> a.absolutePath <=> b.absolutePath }.each { productFile ->
            hostDigest.update(('\u0000' + rootProject.projectDir.toPath().relativize(productFile.toPath()).toString().replace('\\','/') + '\u0000').getBytes('UTF-8'))
            hostDigest.update(productFile.bytes)
        }
        buildConfigField 'String', 'OFFLINE_HOST_BUILD', '"' + hostDigest.digest().encodeHex().toString() + '"'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures { buildConfig true }
    // initWith copies build settings, not src/debug resources. This isolated QA
    // application uses the same loopback-only network policy as Debug.
    sourceSets { offlineQa.res.srcDirs += 'src/debug/res' }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
        coreLibraryDesugaringEnabled true
    }
    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            buildConfigField 'int', 'API_PORT', requestedPort.toInteger().toString()
            buildConfigField 'String', 'SESSION_NAMESPACE', '"debug-' + requestedNamespace + '"'
        }
        offlineQa {
            initWith debug
            applicationIdSuffix '.offlineqa'
            versionNameSuffix '-offlineqa'
            matchingFallbacks = ['debug']
            buildConfigField 'String', 'SESSION_NAMESPACE', '"offlineqa-' + requestedNamespace + '"'
        }
        release {
            buildConfigField 'int', 'API_PORT', '0'
            buildConfigField 'String', 'SESSION_NAMESPACE', '"release-unconfigured"'
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation 'androidx.work:work-runtime:2.10.1'
    implementation 'androidx.sqlite:sqlite-bundled:2.7.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation 'org.json:json:20250517'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    androidTestImplementation 'androidx.work:work-testing:2.10.1'
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// G4-1（第61轮圆桌）：assets/public 必须与最新前端构建一致——绕过 scripts/build-mobile.ps1
// 直接 assemble 曾静默嵌入陈旧前端（round-52 事故），此处升级为构建期硬校验。
// 按 dist→assets 的包含式 size 对比：Capacitor sync 生成的 capacitor.config.json
// 等额外文件不计入，只要求 dist 的每个产物都不陈旧、不缺失。
def webAssetEntries(File dir) {
    def entries = [:]
    if (dir.isDirectory()) {
        dir.eachFileRecurse { file ->
            if (file.isFile()) {
                entries[dir.toPath().relativize(file.toPath()).toString().replace('\\', '/')] = file.length()
            }
        }
    }
    return entries
}
tasks.matching { it.name ==~ /pre(Debug|OfflineQa|Release)Build/ }.configureEach {
    doFirst {
        def distEntries = webAssetEntries(new File(rootProject.projectDir, '../dist'))
        def embeddedEntries = webAssetEntries(file('src/main/assets/public'))
        if (!distEntries) {
            throw new GradleException('apps/mobile/dist missing/empty: build via scripts/build-mobile.ps1 (frontend -> cap sync -> assemble)')
        }
        if (!embeddedEntries) {
            throw new GradleException('src/main/assets/public missing/empty: run npx cap sync android before assembling')
        }
        def stale = distEntries.findAll { relativePath, size -> embeddedEntries[relativePath] != size }.collect { it.key }
        if (stale) {
            throw new GradleException('Embedded web assets are stale (' + stale.size() + ' file(s), e.g. ' + stale.first() + '): run npm run build + npx cap sync android (or scripts/build-mobile.ps1) before assembling.')
        }
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
