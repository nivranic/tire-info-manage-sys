[project]
name = "tire-intelligence-api"
version = "0.1.0"
description = "Evidence-first tire intelligence API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0.38,<3",
  "pydantic>=2.10,<3",
  "aiohttp>=3.12,<4",
  "psycopg[binary]>=3.2,<4",
  "boto3>=1.40,<2",
  "reportlab>=4.4,<5",
  "opentelemetry-api>=1.45,<2",
  "opentelemetry-sdk>=1.45,<2",
  "opentelemetry-exporter-prometheus>=0.66b0,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "httpx>=0.28,<1",
    "fonttools>=4.58,<5",
    "pypdf>=6,<7",
    "pypdfium2>=4.30,<6",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tire_api*"]

[tool.setuptools.package-data]
tire_api = ["assets/fonts/*.ttf", "assets/fonts/OFL.txt", "assets/fonts/provenance.json", "assets/fonts/README.md", "assets/fonts/build_font.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
